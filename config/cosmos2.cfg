-- The launcher places this beside the unmodified upstream configuration.
dofile("openspace.cfg")
local project = os.getenv("COSMOS2_ROOT")
assert(project, "Use Iniciar-Cosmos2.cmd")
Paths.COSMOS2 = project
Paths.USER = project .. "/user"
Paths.LOGS = project .. "/output/logs"
Paths.CACHE = os.getenv("COSMOS2_CACHE") or (project .. "/output/cache")
Paths.SYNC = project .. "/data/sync"
SGCTConfig = os.getenv("COSMOS2_WINDOW_CONFIG") or (project .. "/config/window.json")
Profile = "cosmos2"
BypassLauncher = true
GlobalCustomizationScripts = {}
VersionCheckUrl = ""
ModuleConfigurations.GlobeBrowsing.TileCacheSize = 512
ModuleConfigurations.WebBrowser.EnableRemoteDebugging = os.getenv("COSMOS2_INSPECT_CEF") == "1"
ShutdownCountdown = 1
